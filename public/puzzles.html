<style>
:root{
  --bg:#f4f1ea;--fg:#1d1d1b;--panel:#fff;--muted:#6b6b66;--accent:#2f6f3e;
  --sq-l:#eeeed2;--sq-d:#769656;--sel:rgba(255,235,59,.4);--hint:rgba(0,0,0,.22);--last:rgba(255,235,59,.28);--chk:rgba(229,83,75,.85);
  --bs:min(94vw,520px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
}
:root[data-theme="dark"]{--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 24px}
h1{margin:0;font-size:22px}
.bar{width:var(--bs);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{width:var(--bs);padding:10px 12px;background:var(--panel);border-radius:8px;font-weight:600;min-height:42px}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.chk{background-image:radial-gradient(circle,var(--chk) 0%,rgba(229,83,75,0) 72%)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:5px solid var(--hint)}
.pc{width:88%;height:88%;display:flex;pointer-events:none}.pc svg{width:100%;height:100%;stroke:#000;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.dt{fill:none}.pc.w .dt{stroke:#000}.pc.w .ey{fill:#000}
.pc.b svg{fill:#2a2a2a}.pc.b .dt{stroke:#ddd}.pc.b .ey{fill:#ddd}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.65;pointer-events:none;color:#333}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
#moves{width:var(--bs);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px;line-height:1.6}
#moves b{color:var(--fg);font-weight:600}

.hide{display:none!important}
a{color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
#stats{width:var(--bs);display:flex;justify-content:space-between;gap:8px;font-size:14px;background:var(--panel);border-radius:8px;padding:8px 12px}
#info{width:var(--bs);color:var(--muted);font-size:14px}
</style>

":2,"r":1550},{"f":"2b3n1/3ppkb1/8/5q2/8/3r4/6K1/8 b - - 0 1","n":2,"r":1550},{"f":"rn2k3/3p4/2n5/p7/5pp1/2b5/1q6/6K1 b - - 0 1","n":2,"r":1550},{"f":"1r3kn1/8/8/6p1/8/p2q2P1/8/4K3 b - - 0 1","n":2,"r":1550},{"f":"2r2kn1/8/3q4/6p1/8/p7/8/5K2 b - - 0 1","n":2,"r":1550},{"f":"2k5/8/1R6/3N4/4P3/5R2/P1P5/6K1 w - - 0 1","n":2,"r":1550},{"f":"8/p5k1/2b1p3/2p5/pr6/5r2/8/6K1 b - - 0 1","n":2,"r":1550}];
const KEY="chessTrainer";
const $=id=>document.getElementById(id);
let S={rating:800,solved:0,streak:0,lastDaily:0,seen:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(window.Account)Account.push();}
const today=()=>Math.floor(Date.now()/86400000);

let mode="daily",pi=0,g=null,you="w",remaining=1,mistakes=0,hinted=false,revealed=false,done=false,busy=false,counted=false;
let sel=null,targets=[],last=null,flipped=false,hintSq=null,solMove=null,statusMsg="",delta=0;

/* ---- поиск мата (перебор) ---- */
function mates(pos,n){
  for(const m of pos.moves()){
    pos.move(m);
    let ok=false;
    if(pos.in_checkmate())ok=true;
    else if(n>1&&!pos.game_over())ok=allReplies(pos,n-1);
    pos.undo();
    if(ok)return true;
  }
  return false;
}
function allReplies(pos,k){
  const rs=pos.moves();
  if(!rs.length)return false;
  for(const r of rs){
    pos.move(r);
    const ok=mates(pos,k);
    pos.undo();
    if(!ok)return false;
  }
  return true;
}
function isGood(m){
  g.move({from:m.from,to:m.to,promotion:"q"});
  let ok=false;
  if(g.in_checkmate())ok=true;
  else if(remaining>1&&!g.game_over())ok=allReplies(g,remaining-1);
  g.undo();
  return ok;
}
function goodMoves(){
  return g.moves({verbose:true}).filter(m=>(!m.promotion||m.promotion==="q")&&isGood(m));
}

/* ---- загрузка пазла ---- */
function load(i){
  pi=i;const p=PUZ[i];
  g=new Chess(p.f);you=g.turn();flipped=(you==="b");
  remaining=p.n;mistakes=0;hinted=false;revealed=false;done=false;busy=false;counted=false;
  sel=null;targets=[];last=null;hintSq=null;solMove=null;delta=0;
  statusMsg="Твой ход: мат в "+p.n+(p.n===1?" ход":" хода");
  render();
}
function pickTrain(){
  let pool=PUZ.map((p,i)=>i).filter(i=>S.seen.indexOf(i)<0);
  if(!pool.length){S.seen=[];pool=PUZ.map((p,i)=>i);}
  pool.sort((a,b)=>Math.abs(PUZ[a].r-S.rating)-Math.abs(PUZ[b].r-S.rating));
  const top=pool.slice(0,4);
  return top[Math.floor(Math.random()*top.length)];
}
function setMode(m){
  mode=m;
  $("tabDaily").classList.toggle("on",m==="daily");
  $("tabTrain").classList.toggle("on",m==="train");
  if(m==="daily")load((today()*37)%PUZ.length);
  else{const i=pickTrain();S.seen.push(i);if(S.seen.length>40)S.seen.shift();save();load(i);}
}

/* ---- рейтинг и серия ---- */
function applyRating(win){
  if(counted||mode!=="train")return;
  counted=true;
  const pr=PUZ[pi].r,E=1/(1+Math.pow(10,(pr-S.rating)/400));
  delta=Math.round(32*((win?1:0)-E));
  S.rating=Math.max(100,S.rating+delta);save();
}
function finish(){
  done=true;busy=false;
  S.solved++;
  if(mode==="train")applyRating(mistakes===0&&!hinted);
  if(mode==="daily"&&S.lastDaily!==today()){
    S.streak=(S.lastDaily===today()-1)?S.streak+1:1;
    S.lastDaily=today();
  }
  save();
  statusMsg="Мат! Пазл решён 🎉"+(mode==="train"&&delta?" Рейтинг "+(delta>0?"+":"")+delta:"")+(mode==="daily"?" Серия дней: "+S.streak:"");
  render();
}
function mistake(){
  mistakes++;
  if(mode==="train")applyRating(false);
  statusMsg="Не то. Попробуй ещё раз"+(mode==="train"&&delta?" (рейтинг "+delta+")":"");
}

/* ---- ходы ---- */
function onSquare(name){
  if(done||busy)return;
  const m=targets.find(x=>x.to===name);
  if(sel&&m){playMove(m);return;}
  const p=g.get(name);
  if(p&&p.color===you){sel=name;targets=g.moves({square:name,verbose:true});}
  else{sel=null;targets=[];}
  hintSq=null;render();
}
function playMove(m){
  const prev=last;
  const mv=g.move({from:m.from,to:m.to,promotion:"q"});
  sel=null;targets=[];hintSq=null;
  if(g.in_checkmate()){last={from:mv.from,to:mv.to};finish();return;}
  if(remaining>1&&!g.game_over()&&allReplies(g,remaining-1)){
    last={from:mv.from,to:mv.to};remaining--;busy=true;
    statusMsg="Верно! Соперник отвечает…";render();
    setTimeout(()=>{
      const rs=g.moves({verbose:true});
      const r=rs[Math.floor(Math.random()*rs.length)];
      g.move({from:r.from,to:r.to,promotion:r.promotion});
      last={from:r.from,to:r.to};busy=false;
      statusMsg="Твой ход: мат в "+remaining+(remaining===1?" ход":" хода");
      render();
    },600);
    return;
  }
  g.undo();last=prev;mistake();render();
}
$("hint").onclick=()=>{
  if(done||busy)return;
  const gm=goodMoves();
  if(gm.length){hinted=true;hintSq=gm[0].from;sel=null;targets=[];statusMsg="Подсказка: ходи фигурой на выделенной клетке";render();}
};
$("solution").onclick=()=>{
  if(done||busy)return;
  const gm=goodMoves();
  if(!gm.length)return;
  revealed=true;done=true;
  if(mode==="train")applyRating(false);
  solMove=gm[0];
  statusMsg="Решение: "+gm[0].san+(remaining>1?" (и мат следующим ходом)":"");
  save();render();
};
$("next").onclick=()=>{setMode("train");};
$("tabDaily").onclick=()=>setMode("daily");
$("tabTrain").onclick=()=>setMode("train");

/* ---- отрисовка ---- */
function render(){
  const bd=g.board(),boardEl=$("board");
  boardEl.innerHTML="";
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=flipped?7-i:i,f=flipped?7-j:j;
    const name="abcdefgh"[f]+(8-r);
    const p=bd[r][f];
    const d=document.createElement("div");
    d.className="sq "+((r+f)%2===0?"l":"d");
    if(last&&(last.from===name||last.to===name))d.classList.add("last");
    if(solMove&&(solMove.from===name||solMove.to===name))d.classList.add("sel");
    if(sel===name||hintSq===name)d.classList.add("sel");
    const t=targets.find(m=>m.to===name);
    if(t){d.classList.add("hint");if(p||t.flags.indexOf("e")>=0)d.classList.add("cap");}
    if(p){const s=document.createElement("span");s.className="pc "+p.color;s.innerHTML=SVG[p.type];d.appendChild(s);}
    if(j===0){const c=document.createElement("span");c.className="coord r";c.textContent=8-r;d.appendChild(c);}
    if(i===7){const c=document.createElement("span");c.className="coord f";c.textContent="abcdefgh"[f];d.appendChild(c);}
    d.onclick=()=>onSquare(name);
    boardEl.appendChild(d);
  }
  const p=PUZ[pi];
  let info=(mode==="daily"?"Пазл дня":"Тренировка")+" · мат в "+p.n+" · сложность "+p.r+" · ты играешь "+(you==="w"?"белыми":"чёрными");
  if(mode==="daily"&&S.lastDaily===today()&&!done)info+=" · сегодняшний пазл уже засчитан ✓";
  $("info").textContent=info;
  $("status").textContent=statusMsg;
  $("stats").innerHTML="<span>Рейтинг: <b>"+S.rating+"</b></span><span>Серия дней: <b>"+S.streak+"</b></span><span>Решено: <b>"+S.solved+"</b></span>";
  $("next").classList.toggle("hide",!done);
  $("next").textContent=mode==="daily"?"К тренировке":"Следующий пазл";
  $("hint").classList.toggle("hide",done);
  $("solution").classList.toggle("hide",done);
}
setMode("daily");
</script>
