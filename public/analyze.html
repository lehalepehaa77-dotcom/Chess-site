<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анализ партии</title>
<style>
:root{
  --bg:#f4f1ea;--fg:#1d1d1b;--panel:#fff;--muted:#6b6b66;--accent:#2f6f3e;
  --sq-l:#eeeed2;--sq-d:#769656;--sel:rgba(255,235,59,.4);--hint:rgba(0,0,0,.22);--last:rgba(255,235,59,.28);--chk:rgba(229,83,75,.85);
  --bs:min(94vw,520px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
}
:root[data-theme="dark"]{--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 24px}
h1{margin:0;font-size:22px}
.bar{width:var(--bs);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{width:var(--bs);padding:10px 12px;background:var(--panel);border-radius:8px;font-weight:600;min-height:42px}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.chk{background-image:radial-gradient(circle,var(--chk) 0%,rgba(229,83,75,0) 72%)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:5px solid var(--hint)}
.pc{width:88%;height:88%;display:flex;pointer-events:none}.pc svg{width:100%;height:100%;stroke:#000;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.dt{fill:none}.pc.w .dt{stroke:#000}.pc.w .ey{fill:#000}
.pc.b svg{fill:#2a2a2a}.pc.b .dt{stroke:#ddd}.pc.b .ey{fill:#ddd}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.65;pointer-events:none;color:#333}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
#moves{width:var(--bs);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px;line-height:1.6}
#moves b{color:var(--fg);font-weight:600}

.hide{display:none!important}
.card{width:var(--bs);background:var(--panel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--muted);border-radius:8px;padding:8px}
a{color:var(--accent)}
#evalbar{width:var(--bs);height:14px;background:#333;border-radius:7px;overflow:hidden;position:relative}
#evalfill{height:100%;background:#f2f2f2;width:50%;transition:width .25s}
#evaltxt{width:var(--bs);font-size:13px;color:var(--muted);text-align:center}
#comment{width:var(--bs);min-height:46px;background:var(--panel);border-radius:8px;padding:10px 12px;font-size:15px}
#graph{width:var(--bs);height:70px;background:var(--panel);border-radius:8px;cursor:pointer;display:block}
.mv{cursor:pointer;padding:1px 4px;border-radius:4px;border-bottom:3px solid transparent;display:inline-block}
.mv.cur{background:var(--sel)}
.sq{cursor:default}
</style>
</head>
<body>
<h1>🔍 Анализ партии</h1>

<div class="card" id="inputBox">
  <textarea id="pgn" rows="5" placeholder="Вставь PGN или ходы: 1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 …"></textarea>
  <div class="bar" style="width:auto">
    <button class="primary" id="go">Анализировать</button>
    <a href="/">← На главную</a>
  </div>
  <div id="msg" style="color:var(--muted);font-size:14px">Анализ идёт прямо в твоём браузере и занимает около полуминуты на партию.</div>
</div>

<div id="result" class="hide" style="display:contents">
  <div class="card" id="sum"></div>
  <div id="evalbar"><div id="evalfill"></div></div>
  <div id="evaltxt"></div>
  <div id="board"></div>
  <div id="comment"></div>
  <div class="bar">
    <button id="first">⏮</button><button id="prev">◀</button><button id="next">▶</button><button id="lastb">⏭</button><button id="flip">Перевернуть</button>
  </div>
  <svg id="graph" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
  <div id="moves"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const SVG={
p:`<svg viewBox='0 0 45 45'><path d='M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z'/></svg>`,
r:`<svg viewBox='0 0 45 45'><path d='M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5'/><path d='M34 14l-3 3H14l-3-3'/><path d='M31 17v12.5H14V17M31 29.5l1.5 2.5h-20l1.5-2.5'/><path class='dt' d='M11 14h23'/></svg>`,
n:`<svg viewBox='0 0 45 45'><path d='M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21'/><path d='M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3'/><circle class='ey' cx='9' cy='25.5' r='1'/></svg>`,
b:`<svg viewBox='0 0 45 45'><path d='M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z'/><path d='M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z'/><circle cx='22.5' cy='8' r='2.5'/><path class='dt' d='M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5'/></svg>`,
q:`<svg viewBox='0 0 45 45'><path d='M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.2-8.2 13.4-8.2-13.4L14 25 6.5 13.5z'/><path d='M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z'/><circle cx='6' cy='12' r='2'/><circle cx='14' cy='9' r='2'/><circle cx='22.5' cy='8' r='2'/><circle cx='31' cy='9' r='2'/><circle cx='39' cy='12' r='2'/><path class='dt' d='M11 38.5c5.5 1.5 17.5 1.5 23 0M11.5 30c3.5-1 18.5-1 22 0'/></svg>`,
k:`<svg viewBox='0 0 45 45'><path d='M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5'/><path d='M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z'/><path class='dt' d='M22.5 11.63V6M20 8h5M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0'/></svg>`
};
const $=id=>document.getElementById(id);
const LAB={best:["Лучший ход","#3a9d5d",""],good:["Хороший ход","#7aa83a",""],inacc:["Неточность","#e0a800","?!"],mist:["Ошибка","#e57f22","?"],blun:["Грубая ошибка","#d9433b","??"]};
const wp=cp=>50+50*(2/(1+Math.exp(-0.00368208*cp))-1);
const clampCp=c=>Math.max(-1500,Math.min(1500,c));
let fens=[],moves=[],cpW=[],bestUci=[],info=[],cur=0,flipped=false;

/* ---------- Движок Stockfish (в браузере, через Web Worker) ---------- */
const URLS=[
  "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
  "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js"
];
let eng=null,waiter=null;
function spawn(url){
  return new Promise((res,rej)=>{
    let w;
    try{w=new Worker(URL.createObjectURL(new Blob(['importScripts("'+url+'");'],{type:"text/javascript"})));}
    catch(e){return rej(e);}
    const to=setTimeout(()=>{w.terminate();rej(new Error("timeout"));},20000);
    w.onerror=e=>{clearTimeout(to);w.terminate();rej(e);};
    w.onmessage=e=>{if(typeof e.data==="string"&&e.data.indexOf("uciok")===0){clearTimeout(to);res(w);}};
    w.postMessage("uci");
  });
}
async function getEngine(){
  for(const u of URLS){
    try{const w=await spawn(u);w.onerror=null;w.onmessage=onLine;return w;}catch(e){}
  }
  throw new Error("engine");
}
function onLine(e){
  const l=typeof e.data==="string"?e.data:"";
  if(!waiter)return;
  if(l.indexOf("info")===0&&l.indexOf(" score ")>0){
    const m=l.match(/score (cp|mate) (-?\d+)/);
    if(m)waiter.cp=m[1]==="cp"?+m[2]:(+m[2]>0?1500:-1500);
  }else if(l.indexOf("bestmove")===0){
    const w=waiter;waiter=null;
    const b=l.split(" ")[1];
    w.res({cp:clampCp(w.cp),best:(b&&b!=="(none)")?b:null});
  }
}
function evalFen(fen){
  const g=new Chess(fen);
  if(g.game_over())return Promise.resolve({cp:g.in_checkmate()?-1500:0,best:null});
  return new Promise(res=>{
    waiter={res,cp:0};
    eng.postMessage("position fen "+fen);
    eng.postMessage("go movetime 400");
  });
}

/* ---------- Анализ ---------- */
const msg=t=>{$("msg").textContent=t;};
async function analyze(){
  const text=$("pgn").value.trim();
  const g=new Chess();
  if(!text||!g.load_pgn(text,{sloppy:true})){msg("Не получилось прочитать партию. Проверь, что вставлен PGN или список ходов.");return;}
  const hist=g.history({verbose:true}).slice(0,160);
  if(!hist.length){msg("В партии нет ходов.");return;}
  const b=new Chess();
  fens=[b.fen()];moves=[];
  for(const m of hist){moves.push(b.move({from:m.from,to:m.to,promotion:m.promotion}));fens.push(b.fen());}
  $("go").disabled=true;
  msg("Загружаем шахматный движок…");
  try{eng=await getEngine();}
  catch(e){msg("Не удалось загрузить шахматный движок. Проверь интернет и попробуй ещё раз.");$("go").disabled=false;return;}
  cpW=[];bestUci=[];
  for(let i=0;i<fens.length;i++){
    msg("Анализ: позиция "+(i+1)+" из "+fens.length+"…");
    const r=await evalFen(fens[i]);
    cpW[i]=fens[i].split(" ")[1]==="w"?r.cp:-r.cp;
    bestUci[i]=r.best;
  }
  eng.terminate();eng=null;
  classify();
  $("inputBox").classList.add("hide");
  $("result").classList.remove("hide");
  cur=moves.length;
  render();
}
function classify(){
  info=[null];
  for(let i=1;i<fens.length;i++){
    const mv=moves[i-1],isW=mv.color==="w";
    const before=isW?cpW[i-1]:-cpW[i-1],after=isW?cpW[i]:-cpW[i];
    const wl=Math.max(0,wp(before)-wp(after));
    const played=mv.from+mv.to+(mv.promotion||"");
    const kind=played===bestUci[i-1]?"best":wl<5?"good":wl<10?"inacc":wl<20?"mist":"blun";
    const acc=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*wl)-3.1669));
    let bestSan=null;
    if(bestUci[i-1]&&kind!=="best"){
      const g2=new Chess(fens[i-1]);
      const bm=bestUci[i-1];
      const m2=g2.move({from:bm.slice(0,2),to:bm.slice(2,4),promotion:bm[4]});
      bestSan=m2?m2.san:bm;
    }
    info[i]={kind,acc,bestSan,color:mv.color};
  }
  const out=[];
  for(const c of ["w","b"]){
    const a=info.filter(x=>x&&x.color===c);
    const n=k=>a.filter(x=>x.kind===k).length;
    const acc=a.length?a.reduce((s,x)=>s+x.acc,0)/a.length:0;
    out.push("<b>"+(c==="w"?"Белые":"Чёрные")+":</b> точность ≈ "+acc.toFixed(0)+"% · неточностей: "+n("inacc")+" · ошибок: "+n("mist")+" · грубых ошибок: "+n("blun"));
  }
  $("sum").innerHTML=out.join("<br>");
}

/* ---------- Отрисовка ---------- */
function fmt(cp){return Math.abs(cp)>=1400?(cp>0?"+мат":"−мат"):((cp>0?"+":cp<0?"−":"")+(Math.abs(cp)/100).toFixed(2));}
function render(){
  const g=new Chess(fens[cur]);
  const bd=g.board();
  const last=cur>0?moves[cur-1]:null;
  const board=$("board");board.innerHTML="";
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=flipped?7-i:i,f=flipped?7-j:j;
    const name="abcdefgh"[f]+(8-r);
    const p=bd[r][f];
    const d=document.createElement("div");
    d.className="sq "+((r+f)%2===0?"l":"d");
    if(last&&(last.from===name||last.to===name))d.classList.add("last");
    if(p){const s=document.createElement("span");s.className="pc "+p.color;s.innerHTML=SVG[p.type];d.appendChild(s);}
    board.appendChild(d);
  }
  const w=wp(cpW[cur]);
  $("evalfill").style.width=(flipped?100-w:w)+"%";
  $("evaltxt").textContent="Оценка: "+fmt(cpW[cur])+" (плюс в пользу белых)";
  const c=$("comment");
  if(cur===0){c.textContent="Начальная позиция. Листай ходы кнопками ◀ ▶ или нажми на ход в списке.";}
  else{
    const x=info[cur],L=LAB[x.kind],mv=moves[cur-1];
    c.innerHTML="<b style='color:"+L[1]+"'>"+mv.san+" "+L[2]+"</b> — "+L[0]+(x.bestSan?". Лучше было: <b>"+x.bestSan+"</b>":"");
  }
  // график
  const N=moves.length||1;let pts="";
  for(let i=0;i<=moves.length;i++)pts+=(i/N*300).toFixed(1)+","+(70-wp(cpW[i])*0.7).toFixed(1)+" ";
  const cx=(cur/N*300).toFixed(1);
  $("graph").innerHTML="<polygon points='0,70 "+pts+"300,70' fill='#bbb' opacity='.55'/><line x1='0' y1='35' x2='300' y2='35' stroke='#888' stroke-width='.5'/><line x1='"+cx+"' y1='0' x2='"+cx+"' y2='70' stroke='#d9433b' stroke-width='1.5'/>";
  // список ходов
  let h="";
  moves.forEach((m,i)=>{
    const k=info[i+1].kind;
    if(i%2===0)h+="<b>"+(i/2+1)+".</b> ";
    h+="<span class='mv"+(i+1===cur?" cur":"")+"' data-i='"+(i+1)+"' style='border-bottom-color:"+(k==="best"||k==="good"?"transparent":LAB[k][1])+"'>"+m.san+LAB[k][2]+"</span> ";
  });
  $("moves").innerHTML=h;
}
function go(i){cur=Math.max(0,Math.min(moves.length,i));render();}
$("moves").onclick=e=>{const t=e.target.closest(".mv");if(t)go(+t.dataset.i);};
$("graph").onclick=e=>{const r=$("graph").getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*moves.length));};
$("first").onclick=()=>go(0);$("prev").onclick=()=>go(cur-1);
$("next").onclick=()=>go(cur+1);$("lastb").onclick=()=>go(moves.length);
$("flip").onclick=()=>{flipped=!flipped;render();};
document.addEventListener("keydown",e=>{if(!moves.length)return;if(e.key==="ArrowLeft")go(cur-1);if(e.key==="ArrowRight")go(cur+1);});
$("go").onclick=analyze;

try{
  const saved=localStorage.getItem("lastPgn");
  if(saved){$("pgn").value=saved;if(new URLSearchParams(location.search).get("auto")==="1")analyze();}
}catch(e){}
</script>
</body>
</html>
