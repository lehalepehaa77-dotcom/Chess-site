<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахматы</title>
<style>
:root{
  --bg:#f4f1ea;--fg:#1d1d1b;--panel:#fff;--muted:#6b6b66;--accent:#2f6f3e;
  --sq-l:#eeeed2;--sq-d:#769656;--sel:rgba(255,235,59,.4);--hint:rgba(0,0,0,.22);--last:rgba(255,235,59,.28);--chk:rgba(229,83,75,.85);
  --bs:min(94vw,520px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
}
:root[data-theme="dark"]{--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 24px}
h1{margin:0;font-size:22px}
.bar{width:var(--bs);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{width:var(--bs);padding:10px 12px;background:var(--panel);border-radius:8px;font-weight:600;min-height:42px}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.chk{background-image:radial-gradient(circle,var(--chk) 0%,rgba(229,83,75,0) 72%)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:5px solid var(--hint)}
.pc{width:88%;height:88%;display:flex;pointer-events:none}.pc svg{width:100%;height:100%;stroke:#000;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.dt{fill:none}.pc.w .dt{stroke:#000}.pc.w .ey{fill:#000}
.pc.b svg{fill:#2a2a2a}.pc.b .dt{stroke:#ddd}.pc.b .ey{fill:#ddd}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.65;pointer-events:none;color:#333}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
#moves{width:var(--bs);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px;line-height:1.6}
#moves b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<h1>♟︎ Шахматы</h1>
<a href="/" style="color:var(--accent)">← Онлайн-игра с другом</a>
<div class="bar">
  <select id="mode">
    <option value="bot">Против бота</option>
    <option value="two">Вдвоём на одном экране</option>
  </select>
  <select id="color"><option value="w">Я белыми</option><option value="b">Я чёрными</option></select>
  <select id="level"><option value="1">Лёгкий</option><option value="2" selected>Средний</option><option value="3">Сложный</option></select>
</div>
<div class="bar">
  <button class="primary" id="new">Новая партия</button>
  <button id="undo">Отменить ход</button>
  <button id="flip">Перевернуть</button>
</div>
<div id="status"></div>
<div id="board"></div>
<div id="moves"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const SVG={
p:`<svg viewBox='0 0 45 45'><path d='M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z'/></svg>`,
r:`<svg viewBox='0 0 45 45'><path d='M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5'/><path d='M34 14l-3 3H14l-3-3'/><path d='M31 17v12.5H14V17M31 29.5l1.5 2.5h-20l1.5-2.5'/><path class='dt' d='M11 14h23'/></svg>`,
n:`<svg viewBox='0 0 45 45'><path d='M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21'/><path d='M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3'/><circle class='ey' cx='9' cy='25.5' r='1'/></svg>`,
b:`<svg viewBox='0 0 45 45'><path d='M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z'/><path d='M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z'/><circle cx='22.5' cy='8' r='2.5'/><path class='dt' d='M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5'/></svg>`,
q:`<svg viewBox='0 0 45 45'><path d='M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.2-8.2 13.4-8.2-13.4L14 25 6.5 13.5z'/><path d='M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z'/><circle cx='6' cy='12' r='2'/><circle cx='14' cy='9' r='2'/><circle cx='22.5' cy='8' r='2'/><circle cx='31' cy='9' r='2'/><circle cx='39' cy='12' r='2'/><path class='dt' d='M11 38.5c5.5 1.5 17.5 1.5 23 0M11.5 30c3.5-1 18.5-1 22 0'/></svg>`,
k:`<svg viewBox='0 0 45 45'><path d='M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5'/><path d='M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z'/><path class='dt' d='M22.5 11.63V6M20 8h5M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0'/></svg>`
};
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
let game=new Chess(),sel=null,targets=[],last=null,flipped=false,thinking=false;
const $=id=>document.getElementById(id);
const boardEl=$("board");

function botColor(){return $("color").value==="w"?"b":"w";}
function isBotTurn(){return $("mode").value==="bot"&&game.turn()===botColor();}

function render(){
  boardEl.innerHTML="";
  const b=game.board();
  const kingSq=game.in_check()?findKing(game.turn()):null;
  for(let i=0;i<8;i++){
    for(let j=0;j<8;j++){
      const r=flipped?7-i:i, f=flipped?7-j:j;
      const name="abcdefgh"[f]+(8-r);
      const p=b[r][f];
      const d=document.createElement("div");
      d.className="sq "+((r+f)%2===0?"l":"d");
      if(last&&(last.from===name||last.to===name))d.classList.add("last");
      if(sel===name)d.classList.add("sel");
      if(kingSq===name)d.classList.add("chk");
      const t=targets.find(m=>m.to===name);
      if(t){d.classList.add("hint");if(p||t.flags.includes("e"))d.classList.add("cap");}
      if(p){const s=document.createElement("span");s.className="pc "+p.color;s.innerHTML=SVG[p.type];d.appendChild(s);}
      if(j===0){const c=document.createElement("span");c.className="coord r";c.textContent=8-r;d.appendChild(c);}
      if(i===7){const c=document.createElement("span");c.className="coord f";c.textContent="abcdefgh"[f];d.appendChild(c);}
      d.onclick=()=>onSquare(name);
      boardEl.appendChild(d);
    }
  }
  updateStatus();updateMoves();
}
function findKing(color){
  const b=game.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==="k"&&p.color===color)return "abcdefgh"[f]+(8-r);}
}
function updateStatus(){
  let s;
  const who=game.turn()==="w"?"белых":"чёрных";
  if(game.in_checkmate())s="Мат! Победили "+(game.turn()==="w"?"чёрные":"белые")+".";
  else if(game.in_stalemate())s="Пат. Ничья.";
  else if(game.in_threefold_repetition())s="Ничья: троекратное повторение.";
  else if(game.insufficient_material())s="Ничья: недостаточно материала.";
  else if(game.in_draw())s="Ничья.";
  else{
    s="Ход "+who+(game.in_check()?" — шах!":"");
    if(thinking)s="Бот думает…";
  }
  $("status").textContent=s;
}
function updateMoves(){
  const h=game.history();let out="";
  for(let i=0;i<h.length;i+=2){out+="<b>"+(i/2+1)+".</b> "+h[i]+" "+(h[i+1]||"")+"&nbsp; ";}
  $("moves").innerHTML=out||"Ходов пока нет.";
}
function onSquare(name){
  if(game.game_over()||thinking||isBotTurn())return;
  const m=targets.find(x=>x.to===name);
  if(sel&&m){doMove(m);return;}
  const p=game.get(name);
  if(p&&p.color===game.turn()){
    sel=name;targets=game.moves({square:name,verbose:true});
  }else{sel=null;targets=[];}
  render();
}
function doMove(m){
  game.move({from:m.from,to:m.to,promotion:"q"});
  last={from:m.from,to:m.to};sel=null;targets=[];
  render();
  maybeBot();
}
function maybeBot(){
  if(game.game_over()||!isBotTurn())return;
  thinking=true;updateStatus();
  setTimeout(()=>{
    const m=pickMove(+$("level").value);
    thinking=false;
    if(m){game.move({from:m.from,to:m.to,promotion:m.promotion||"q"});last={from:m.from,to:m.to};}
    render();
  },60);
}
/* ---------- Бот: negamax + alpha-beta ---------- */
function evaluate(){
  const b=game.board();let s=0;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const p=b[r][f];if(!p)continue;
    let v=VAL[p.type];
    if(p.type==="p"||p.type==="n"||p.type==="b"){v+=(7-(Math.abs(3.5-r)+Math.abs(3.5-f)))*3;}
    s+=p.color==="w"?v:-v;
  }
  return game.turn()==="w"?s:-s;
}
function ordered(){
  return game.moves({verbose:true}).sort((a,b)=>(b.captured?VAL[b.captured]:0)-(a.captured?VAL[a.captured]:0));
}
function negamax(d,a,b){
  if(d===0)return evaluate();
  const ms=ordered();
  if(!ms.length)return game.in_check()?-99999-d:0;
  let best=-Infinity;
  for(const m of ms){
    game.move(m);
    const s=-negamax(d-1,-b,-a);
    game.undo();
    if(s>best)best=s;
    if(best>a)a=best;
    if(a>=b)break;
  }
  return best;
}
function pickMove(depth){
  const ms=ordered();if(!ms.length)return null;
  let best=-Infinity,pick=[];
  for(const m of ms){
    game.move(m);
    let s=-negamax(depth-1,-Infinity,Infinity);
    game.undo();
    if(depth===1)s+=Math.random()*120;
    if(s>best){best=s;pick=[m];}else if(s===best)pick.push(m);
  }
  return pick[Math.floor(Math.random()*pick.length)];
}
/* ---------- Кнопки ---------- */
function newGame(){
  game=new Chess();sel=null;targets=[];last=null;thinking=false;
  flipped=$("mode").value==="bot"&&$("color").value==="b";
  render();maybeBot();
}
$("new").onclick=newGame;
$("mode").onchange=newGame;$("color").onchange=newGame;
$("flip").onclick=()=>{flipped=!flipped;render();};
$("undo").onclick=()=>{
  if(thinking)return;
  game.undo();
  if($("mode").value==="bot"&&isBotTurn())game.undo();
  sel=null;targets=[];last=null;render();
};
newGame();
</script>
</body>
</html>
