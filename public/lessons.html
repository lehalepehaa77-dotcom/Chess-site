<title>Уроки тренера</title>
<style>
:root{
  --bg:#f4f1ea;--fg:#1d1d1b;--panel:#fff;--muted:#6b6b66;--accent:#2f6f3e;
  --sq-l:#eeeed2;--sq-d:#769656;--sel:rgba(255,235,59,.4);--hint:rgba(0,0,0,.22);--last:rgba(255,235,59,.28);--chk:rgba(229,83,75,.85);
  --bs:min(94vw,520px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
}
:root[data-theme="dark"]{--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 24px}
h1{margin:0;font-size:22px}
.bar{width:var(--bs);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{width:var(--bs);padding:10px 12px;background:var(--panel);border-radius:8px;font-weight:600;min-height:42px}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.chk{background-image:radial-gradient(circle,var(--chk) 0%,rgba(229,83,75,0) 72%)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:5px solid var(--hint)}
.pc{width:88%;height:88%;display:flex;pointer-events:none}.pc svg{width:100%;height:100%;stroke:#000;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.dt{fill:none}.pc.w .dt{stroke:#000}.pc.w .ey{fill:#000}
.pc.b svg{fill:#2a2a2a}.pc.b .dt{stroke:#ddd}.pc.b .ey{fill:#ddd}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.65;pointer-events:none;color:#333}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
#moves{width:var(--bs);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px;line-height:1.6}
#moves b{color:var(--fg);font-weight:600}

.hide{display:none!important}
a{color:var(--accent)}
.lcard{width:var(--bs);background:var(--panel);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border:1px solid transparent}
.lcard:hover{border-color:var(--accent)}
.lcard b{font-size:17px}
.lcard span{color:var(--muted);font-size:14px}
#coach{width:var(--bs);background:var(--panel);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.45;min-height:84px}
#coach.good{border-left:5px solid #3a9d5d}
#coach.bad{border-left:5px solid #d9433b}
#prog{width:var(--bs);color:var(--muted);font-size:14px}
</style>

const LESSONS=[{"id":"pieces","title":"Как ходят фигуры","desc":"Ладья, слон, ферзь, конь, король и пешка: основа основ.","steps":[{"f":"4k3/8/8/p7/8/8/8/R3K3 w - - 0 1","t":"Ладья ходит по горизонтали и вертикали на любое число клеток, если путь свободен. Побей чёрную пешку ладьёй.","ok":"Верно! Ладья прошла по вертикали и взяла пешку.","a":["a1a5"],"wrong":"Ладья ходит только по прямым линиям. Пешка стоит на той же вертикали, что и ладья."},{"f":"4k3/8/8/8/3p4/8/8/B3K3 w - - 0 1","t":"Слон ходит по диагонали на любое число клеток и всегда остаётся на клетках своего цвета. Побей пешку слоном.","ok":"Верно! Слон взял пешку по диагонали.","a":["a1d4"],"wrong":"Слон ходит только по диагоналям. Пешка стоит на длинной диагонали слона."},{"f":"4k3/8/8/8/8/2p5/8/Q3K3 w - - 0 1","t":"Ферзь — сильнейшая фигура: он ходит и как ладья, и как слон. Побей пешку ферзём.","ok":"Верно! Ферзь взял пешку по диагонали.","a":["a1c3"],"wrong":"Пешка стоит на диагонали от ферзя."},{"f":"4k3/8/8/8/8/p7/8/1N2K3 w - - 0 1","t":"Конь ходит буквой «Г»: две клетки в одну сторону и одна вбок. Он единственный умеет перепрыгивать через фигуры. Побей пешку конём.","ok":"Верно! Конь прыгнул «Г» и взял пешку.","a":["b1a3"],"wrong":"Посмотри: две клетки вверх и одна влево от коня."},{"f":"4k3/8/8/8/8/3p4/4K3/8 w - - 0 1","t":"Король ходит на одну клетку в любую сторону, но не может вставать под шах. Побей пешку королём.","ok":"Верно! Пешка стояла без защиты, и король её взял.","a":["e2d3"],"wrong":"Король ходит только на соседние клетки. Пешка рядом с ним по диагонали."},{"f":"4k3/8/8/8/8/3p4/4P3/4K3 w - - 0 1","t":"Пешка идёт вперёд, но бьёт по диагонали вперёд. Побей чёрную пешку своей пешкой.","ok":"Верно! Пешки бьют по диагонали, а не вперёд.","a":["e2d3"],"wrong":"Пешка бьёт наискосок: на одну клетку вперёд и в сторону."}]},{"id":"mate","title":"Шах, мат и пат","desc":"Как выигрывать партию и как случайно не упустить победу.","steps":[{"f":"4k3/8/8/8/8/8/R7/4K3 w - - 0 1","t":"Шах — это угроза королю. Поставь чёрному королю шах ладьёй.","ok":"Шах! Теперь король обязан защититься: уйти, закрыться или побить атакующую фигуру.","a":["a2a8","a2e2"],"wrong":"Нужен ход, после которого ладья нападает на короля e8."},{"f":"6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1","t":"Мат — это шах, от которого невозможно защититься. Чёрный король зажат собственными пешками. Поставь мат ладьёй.","ok":"Мат! Король не может уйти: ему мешают свои пешки. Это называется «мат на последней линии».","n":1,"wrong":"Ладья должна встать на последнюю горизонталь и дать шах, от которого королю не спастись."},{"f":"7k/8/5K2/8/8/8/8/6Q1 w - - 0 1","t":"Король и ферзь работают вместе. Поставь мат ферзём: пусть ему поможет свой король.","ok":"Мат! Ферзя защищает король, поэтому чёрный король не может его побить.","n":1,"wrong":"Поставь ферзя рядом с королём чёрных так, чтобы его защищал твой король."},{"f":"k7/8/1K6/8/8/8/2Q5/8 w - - 0 1","t":"Пат — это когда ходить некому, но шаха нет: партия сразу заканчивается вничью. Выиграй, поставив мат, а не пат!","ok":"Мат! Ты выиграл партию, а не упустил её в ничью.","n":1,"wrong":"Не совсем. Подумай ещё и попробуй другой ход.","stale":"Это пат! Король не под шахом, но ходить ему некуда: ничья. Найди ход, который ставит именно мат."}]},{"id":"fork","title":"Вилка","desc":"Одним ходом нападаем на две фигуры сразу.","steps":[{"f":"r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1","t":"Вилка — ход, после которого одна фигура нападает сразу на две. Особенно любят вилки кони. Найди ход, которым конь нападёт и на короля, и на ладью.","ok":"Вилка! Король обязан уйти из-под шаха, а ты заберёшь ладью на a8.","a":["d5c7"],"wrong":"Ищи клетку, с которой конь бьёт одновременно e8 и a8."},{"f":"2q3k1/8/8/3N4/8/8/8/4K3 w - - 0 1","t":"Теперь вилка на короля и ферзя. Найди ход коня.","ok":"Шах и вилка на ферзя! Ферзь стоит дороже коня, так что обмен очень выгоден.","a":["d5e7"],"wrong":"Конь должен нападать одновременно на g8 и c8."},{"f":"4k3/8/8/2r1n3/8/3P4/8/4K3 w - - 0 1","t":"Вилку может поставить даже пешка! Нападай одним ходом пешки на две фигуры.","ok":"Пешка на d4 бьёт и ладью, и коня. Одну из них ты заберёшь.","a":["d3d4"],"wrong":"Пешка бьёт по диагонали. Поставь её так, чтобы под ударом оказались c5 и e5."}]},{"id":"pin","title":"Связка","desc":"Фигура не может ходить, потому что за ней стоит более ценная.","steps":[{"f":"4k3/8/4n3/8/8/8/8/R5K1 w - - 0 1","t":"Связка: фигура не может уйти, потому что за ней стоит король (или другая ценная фигура). Свяжи чёрного коня ладьёй.","ok":"Конь связан! Если он сдвинется, ладья даст шах королю, а это запрещено правилами.","a":["a1e1"],"wrong":"Поставь ладью на ту же вертикаль, где стоят конь и король."},{"f":"4k3/8/4n3/8/3P4/8/8/4R1K1 w - - 0 1","t":"Связанную фигуру легко атаковать: она не может убежать. Нападай пешкой на связанного коня.","ok":"Конь не может уйти, и ты выигрываешь его. Связки — мощное оружие.","a":["d4d5"],"wrong":"Пешка бьёт по диагонали. Какая пешка может напасть на e6?"}]},{"id":"opening","title":"Три правила дебюта","desc":"Центр, развитие и рокировка: как начинать партию.","steps":[{"f":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w - - 0 1","t":"Правило 1: займи центр пешкой. Сделай ход e4 или d4.","ok":"Отлично! Пешка в центре открывает дорогу слону и ферзю и забирает пространство.","a":["e2e4","d2d4"],"wrong":"Сыграй центральной пешкой: e2-e4 или d2-d4."},{"f":"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w - - 0 1","t":"Правило 2: выводи фигуры (сначала коней и слонов), а не двигай одну и ту же много раз. Выведи коня.","ok":"Хорошо! Конь вышел в игру. Ещё на f3 он нападает на пешку e5.","a":["g1f3","b1c3"],"wrong":"Сейчас лучше всего вывести коня: на f3 или c3."},{"f":"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 4 5","t":"Правило 3: сделай рокировку — король прячется в безопасное место, а ладья включается в игру. Рокируй в короткую сторону (король на g1).","ok":"Рокировка сделана! Король в безопасности, ладья на f1 готова к бою.","a":["e1g1"],"wrong":"Рокировка — это ход королём на две клетки в сторону ладьи: e1 → g1."}]},{"id":"kq","title":"Мат ферзём и королём","desc":"Базовая техника, которую должен знать каждый.","steps":[{"f":"8/8/8/8/8/4K3/Q7/3k4 w - - 0 1","t":"Мат ферзём и королём: ферзь отрезает чёрному королю путь, а свой король подходит на помощь. Главное правило: не ставь пат! Для начала найди мат в 1 ход.","ok":"Мат! Ферзь и король вдвоём загнали короля в ловушку.","n":1,"wrong":"Не совсем. Подумай ещё и попробуй другой ход.","stale":"Это пат — ничья! Король не под шахом, но ходить некуда. Найди ход, который ставит мат."},{"f":"5k2/8/7K/1Q6/8/8/8/8 w - - 0 1","t":"Теперь мат в 2 хода. Сначала сделай ход, после которого чёрному королю некуда деться, а затем поставь мат.","ok":"Мат! Ты провёл полноценную матовую сетку.","n":2,"wrong":"Не совсем. Подумай ещё и попробуй другой ход.","stale":"Это пат — ничья! Найди ход, после которого мат неизбежен."},{"f":"8/8/8/8/4K3/8/7k/4Q3 w - - 0 1","t":"Теперь мат в 2 хода. Сначала сделай ход, после которого чёрному королю некуда деться, а затем поставь мат.","ok":"Мат! Ты провёл полноценную матовую сетку.","n":2,"wrong":"Не совсем. Подумай ещё и попробуй другой ход.","stale":"Это пат — ничья! Найди ход, после которого мат неизбежен."}]}];
const KEY="chessLessons";
const $=id=>document.getElementById(id);
let P={done:{}};
try{const raw=localStorage.getItem(KEY);if(raw)P=Object.assign(P,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}if(window.Account)Account.push();}

let les=null,si=0,s=null,g=null,you="w",remaining=1,solved=false,busy=false,sel=null,targets=[],last=null,flipped=false,hintSq=null,coachText="",coachCls="";

/* ---- список уроков ---- */
function showList(){
  $("lesson").classList.add("hide");$("list").classList.remove("hide");
  $("list").innerHTML=LESSONS.map((l,i)=>"<div class='lcard' data-i='"+i+"'><b>"+(P.done[l.id]?"✅ ":"")+(i+1)+". "+l.title+"</b><span>"+l.desc+"</span><span>Шагов: "+l.steps.length+(P.done[l.id]?" · пройден":"")+"</span></div>").join("");
}
$("list").onclick=e=>{const c=e.target.closest(".lcard");if(c)openLesson(+c.dataset.i);};
function openLesson(i){
  les=LESSONS[i];si=0;
  $("list").classList.add("hide");$("lesson").classList.remove("hide");
  loadStep();
}
$("back").onclick=showList;

/* ---- поиск мата ---- */
function mates(pos,n){
  for(const m of pos.moves()){
    pos.move(m);
    let ok=false;
    if(pos.in_checkmate())ok=true;
    else if(n>1&&!pos.game_over())ok=allReplies(pos,n-1);
    pos.undo();
    if(ok)return true;
  }
  return false;
}
function allReplies(pos,k){
  const rs=pos.moves();
  if(!rs.length)return false;
  for(const r of rs){pos.move(r);const ok=mates(pos,k);pos.undo();if(!ok)return false;}
  return true;
}

/* ---- шаг урока ---- */
function loadStep(){
  s=les.steps[si];
  g=new Chess(s.f);you=g.turn();flipped=(you==="b");
  remaining=s.n||1;solved=false;busy=false;sel=null;targets=[];last=null;hintSq=null;
  coachText=s.t;coachCls="";
  render();
}
function acceptable(m){
  if(s.a)return s.a.indexOf(m.from+m.to)>=0;
  if(m.promotion&&m.promotion!=="q")return false;
  g.move({from:m.from,to:m.to,promotion:"q"});
  let ok=false;
  if(g.in_checkmate())ok=true;
  else if(remaining>1&&!g.game_over())ok=allReplies(g,remaining-1);
  g.undo();
  return ok;
}
function onSquare(name){
  if(solved||busy)return;
  const m=targets.find(x=>x.to===name);
  if(sel&&m){playMove(m);return;}
  const p=g.get(name);
  if(p&&p.color===you){sel=name;targets=g.moves({square:name,verbose:true});}
  else{sel=null;targets=[];}
  hintSq=null;render();
}
function playMove(m){
  sel=null;targets=[];hintSq=null;
  if(!acceptable(m)){
    g.move({from:m.from,to:m.to,promotion:"q"});
    const stale=g.in_stalemate();
    g.undo();
    coachText=(stale&&s.stale)?s.stale:(s.wrong||"Не совсем. Подумай ещё и попробуй другой ход.");
    coachCls="bad";render();return;
  }
  const mv=g.move({from:m.from,to:m.to,promotion:"q"});
  last={from:mv.from,to:mv.to};
  if(s.a||g.in_checkmate()){finishStep();return;}
  remaining--;busy=true;
  coachText="Верно! Соперник ответил. Теперь доведи дело до мата.";coachCls="good";render();
  setTimeout(()=>{
    const rs=g.moves({verbose:true});
    const r=rs[Math.floor(Math.random()*rs.length)];
    g.move({from:r.from,to:r.to,promotion:r.promotion});
    last={from:r.from,to:r.to};busy=false;render();
  },700);
}
function finishStep(){
  solved=true;coachText=s.ok||"Верно!";coachCls="good";render();
}
$("hint").onclick=()=>{
  if(solved||busy)return;
  const gm=g.moves({verbose:true}).filter(acceptable);
  if(gm.length){hintSq=gm[0].from;sel=null;targets=[];coachText="Подсказка: ходить нужно фигурой на выделенной клетке.";coachCls="";render();}
};
$("next").onclick=()=>{
  if(si<les.steps.length-1){si++;loadStep();}
  else{P.done[les.id]=true;save();showList();}
};

/* ---- отрисовка ---- */
function render(){
  const bd=g.board(),boardEl=$("board");
  boardEl.innerHTML="";
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=flipped?7-i:i,f=flipped?7-j:j;
    const name="abcdefgh"[f]+(8-r);
    const p=bd[r][f];
    const d=document.createElement("div");
    d.className="sq "+((r+f)%2===0?"l":"d");
    if(last&&(last.from===name||last.to===name))d.classList.add("last");
    if(sel===name||hintSq===name)d.classList.add("sel");
    const t=targets.find(m=>m.to===name);
    if(t){d.classList.add("hint");if(p||t.flags.indexOf("e")>=0)d.classList.add("cap");}
    if(p){const sp=document.createElement("span");sp.className="pc "+p.color;sp.innerHTML=SVG[p.type];d.appendChild(sp);}
    if(j===0){const c=document.createElement("span");c.className="coord r";c.textContent=8-r;d.appendChild(c);}
    if(i===7){const c=document.createElement("span");c.className="coord f";c.textContent="abcdefgh"[f];d.appendChild(c);}
    d.onclick=()=>onSquare(name);
    boardEl.appendChild(d);
  }
  $("prog").textContent=les.title+" · шаг "+(si+1)+" из "+les.steps.length+" · ты играешь "+(you==="w"?"белыми":"чёрными");
  $("coach").textContent="🎓 "+coachText;
  $("coach").className=coachCls;
  $("next").classList.toggle("hide",!solved);
  $("next").textContent=si<les.steps.length-1?"Дальше":"Завершить урок";
  $("hint").classList.toggle("hide",solved);
}
showList();
</script>
