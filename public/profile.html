<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профиль игрока</title>
<style>
:root{
  --bg:#f4f1ea;--fg:#1d1d1b;--panel:#fff;--muted:#6b6b66;--accent:#2f6f3e;
  --sq-l:#eeeed2;--sq-d:#769656;--sel:rgba(255,235,59,.4);--hint:rgba(0,0,0,.22);--last:rgba(255,235,59,.28);--chk:rgba(229,83,75,.85);
  --bs:min(94vw,520px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
}
:root[data-theme="dark"]{--bg:#1b1c1a;--fg:#ecebe6;--panel:#262724;--muted:#9a9a93;--accent:#5fb36f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 24px}
h1{margin:0;font-size:22px}
.bar{width:var(--bs);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{width:var(--bs);padding:10px 12px;background:var(--panel);border-radius:8px;font-weight:600;min-height:42px}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100px var(--sel)}
.sq.chk{background-image:radial-gradient(circle,var(--chk) 0%,rgba(229,83,75,0) 72%)}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:5px solid var(--hint)}
.pc{width:88%;height:88%;display:flex;pointer-events:none}.pc svg{width:100%;height:100%;stroke:#000;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.dt{fill:none}.pc.w .dt{stroke:#000}.pc.w .ey{fill:#000}
.pc.b svg{fill:#2a2a2a}.pc.b .dt{stroke:#ddd}.pc.b .ey{fill:#ddd}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.65;pointer-events:none;color:#333}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
#moves{width:var(--bs);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:44px;line-height:1.6}
#moves b{color:var(--fg);font-weight:600}

.hide{display:none!important}
a{color:var(--accent)}
.box{width:var(--bs);background:var(--panel);border-radius:10px;padding:12px 14px}
.stats{width:var(--bs);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--panel);border-radius:10px;padding:10px;text-align:center}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:20px}
.grow{display:flex;align-items:center;gap:8px;padding:9px 4px;border-top:1px solid rgba(128,128,128,.2);text-decoration:none;color:var(--fg)}
.grow:first-of-type{border-top:0}
.grow .d{color:var(--muted);font-size:13px;width:48px}
.grow .o{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win{color:#3a9d5d;font-weight:700}.loss{color:#d9433b;font-weight:700}.draw{color:var(--muted);font-weight:700}
#msg{width:var(--bs);color:var(--muted)}
</style>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<script src="/nav.js"></script>
<h1 id="title">👤 Профиль</h1>
<div id="msg">Загрузка…</div>
<div class="stats hide" id="stats"></div>
<div class="box hide" id="graphBox"><div style="font-size:13px;color:var(--muted);margin-bottom:6px">Рейтинг по рейтинговым партиям</div><svg id="graph" viewBox="0 0 300 80" style="width:100%;height:80px" preserveAspectRatio="none"></svg></div>
<div class="box hide" id="games"></div>
<a href="/">← На главную</a>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let name=new URLSearchParams(location.search).get("u")||"";
if(!name){try{const me=JSON.parse(localStorage.getItem("chessAuthUser")||"null");if(me)name=me.username;}catch(e){}}
async function init(){
  if(!name){$("msg").textContent="Войди в аккаунт на главной странице или открой профиль игрока из таблицы лидеров.";return;}
  try{
    const r=await fetch("/api/profile/"+encodeURIComponent(name));
    const j=await r.json();
    if(!r.ok){$("msg").textContent=j.error||"Профиль недоступен.";return;}
    show(j);
  }catch(e){$("msg").textContent="Не удалось загрузить профиль.";}
}
function show(j){
  const u=j.user;
  $("msg").classList.add("hide");
  $("title").textContent="👤 "+u.username;
  $("stats").classList.remove("hide");
  const st=[["Рейтинг",u.rating],["Партий",u.games],["Побед",u.wins],["Ничьих",u.draws],["Поражений",u.losses],["Рейтинг пазлов",u.puzzleRating],["Решено пазлов",u.puzzleSolved],["Серия дней",u.streak],["Уроков пройдено",u.lessonsDone]];
  $("stats").innerHTML=st.map(x=>"<div class='stat'><span>"+x[0]+"</span><b>"+x[1]+"</b></div>").join("");
  const h=j.ratingHistory;
  if(h.length>=2){
    $("graphBox").classList.remove("hide");
    const mn=Math.min(...h),mx=Math.max(...h),rg=Math.max(20,mx-mn);
    const pts=h.map((v,i)=>(i/(h.length-1)*300).toFixed(1)+","+(75-(v-mn)/rg*70).toFixed(1)).join(" ");
    $("graph").innerHTML="<polyline points='"+pts+"' fill='none' stroke='#3a9d5d' stroke-width='2' vector-effect='non-scaling-stroke'/>";
  }
  $("games").classList.remove("hide");
  if(!j.games.length){$("games").textContent="Сыгранных партий пока нет.";return;}
  $("games").innerHTML="<div style='font-size:13px;color:var(--muted);margin-bottom:4px'>Последние партии (нажми, чтобы посмотреть)</div>"+j.games.map(g=>{
    const mine=g.whiteName.toLowerCase()===u.username.toLowerCase()?"w":"b";
    const opp=mine==="w"?g.blackName:g.whiteName;
    let cls,txt;
    if(g.result==="1/2-1/2"){cls="draw";txt="Ничья";}
    else if((g.result==="1-0")===(mine==="w")){cls="win";txt="Победа";}
    else{cls="loss";txt="Поражение";}
    const dl=mine==="w"?g.deltaW:g.deltaB;
    const date=new Date(g.createdAt).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
    return "<a class='grow' href='/game.html?id="+g.id+"'><span class='d'>"+date+"</span><span>"+(mine==="w"?"⚪":"⚫")+"</span><span class='o'>"+esc(opp)+"</span><span class='"+cls+"'>"+txt+"</span><span style='width:34px;text-align:right;font-size:13px'>"+(dl!=null?(dl>0?"+":"")+dl:"")+"</span></a>";
  }).join("");
}
init();
</script>
</body>
</html>
